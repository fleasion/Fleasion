name: Build PyInstaller Packages

on:
  workflow_call:
    outputs:
      app_version:
        description: Application version from pyproject.toml.
        value: ${{ jobs.prepare.outputs.app_version }}
  workflow_dispatch:
  push:
    branches:
      - main
      - main-indev
  pull_request:
    branches:
      - main
      - main-indev

env:
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '0'
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  prepare:
    name: Prepare package metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read version
        id: version
        run: |
          app_version="$(sed -n "s/^version = ['\"]\([^'\"]*\)['\"]$/\1/p" pyproject.toml)"
          if [ -z "$app_version" ]; then
            echo "Could not read project.version from pyproject.toml." >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: Fleasion-v${{ needs.prepare.outputs.app_version }}-Windows.exe
            artifact_path: dist/Fleasion-v*-Windows.exe
          - name: Linux
            os: ubuntu-latest
            artifact_name: Fleasion-v${{ needs.prepare.outputs.app_version }}-Linux
            artifact_path: dist/Fleasion-v*-Linux
          - name: macOS
            os: macos-latest
            artifact_name: Fleasion-v${{ needs.prepare.outputs.app_version }}-MacOS-Universal.zip
            artifact_path: dist/Fleasion-v*-MacOS-Universal.zip

    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libportaudio2 libpipewire-0.3-0 libspa-0.2-modules libpulse0

      - name: Install UPX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --version

      - name: Test macOS proxy helper
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run pytest -q
          tests/test_macos_proxy_helper.py
          tests/test_logging.py
          tests/test_autostart.py

      - name: Install Rosetta
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build package
        run: uv run build

      - name: Prepare Linux executable
        if: runner.os == 'Linux'
        run: |
          linux_binary="$(find dist -maxdepth 1 -type f -name 'Fleasion-v*-Linux' -print -quit)"
          if [ -z "$linux_binary" ]; then
            echo "Could not find Linux executable in dist/." >&2
            exit 1
          fi
          file "$linux_binary" | grep -q 'ELF'
          chmod 755 "$linux_binary"
          test -x "$linux_binary"

      - name: Verify Linux audio runtime
        if: runner.os == 'Linux'
        run: |
          archive_listing="$(uv run pyi-archive_viewer -b -l dist/Fleasion-v*-Linux)"
          printf '%s\n' "$archive_listing" | grep -Ei 'portaudio|pulse|pipewire|jack|alsa|sound' || true
          if [[ "$archive_listing" =~ lib(portaudio|asound|jack|pulse|pulsecommon-|pipewire-) ]]; then
            echo "Linux package must use host audio backend libraries, not the GitHub runner copies." >&2
            exit 1
          fi

      - name: Verify Linux compiled Python dependencies
        if: runner.os == 'Linux'
        run: |
          archive_listing="$(uv run pyi-archive_viewer -b -l dist/Fleasion-v*-Linux)"
          if ! grep -q 'DracoPy' <<< "$archive_listing"; then
            echo "Linux package is missing the bundled DracoPy extension." >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          archive: false
          if-no-files-found: error
