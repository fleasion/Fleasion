[build-system]
requires = ['uv_build>=0.11.0,<0.12.0']
build-backend = 'uv_build'

[project]
name = 'fleasion'
version = "2.4.1b1"
description = 'Roblox asset interceptor and replacer with PySide6 GUI'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'browser-cookie3>=0.20.1; sys_platform == "darwin" or sys_platform == "linux"',
    'cryptography>=42.0.0,<49; sys_platform == "darwin"',
    'cryptography>=49; sys_platform != "darwin"',
    'win11toast>=0.36.3; sys_platform == "win32"',
    'pywin32>=307; sys_platform == "win32"',
    'python-dateutil>=2.9.0',
    'platformdirs>=4.0.0',
    'sounddevice>=0.5.3',
    'soundfile>=0.13.1',
    'zstandard>=0.21.0',
    'certifi>=2024.7.4',
    'requests>=2.32.0',
    'defusedxml>=0.7.1',
    'colorama>=0.4.6',
    'pyopengl>=3.1.0',
    'pillow>=11.0.0',
    'DracoPy>=1.3.0',
    'orjson>=3.9.0',
    'numpy==2.3.5; sys_platform == "win32"',
    'numpy>=2.0.0; sys_platform != "win32"',
    'lz4>=4.4.5',
    'packaging>=26.2',
    'pyside6==6.7.3; sys_platform == "darwin"',
    'pyside6>=6.8.0; sys_platform != "darwin"',
]

[project.urls]
Repository = 'https://github.com/fleasion/Fleasion'
Issues = 'https://github.com/fleasion/Fleasion/issues'
Releases = 'https://github.com/fleasion/Fleasion/releases'

[project.scripts]
fleasion = 'fleasion:main'
app = 'fleasion:main'
build = 'fleasion.scripts.build:main'

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "ruff>=0.16.5",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "launcher.py", "conftest.py"]
exclude = ["build", "dist", ".agents"]

[tool.pytest.ini_options]
markers = [
    "threaded_asyncio: requires working cross-thread event-loop socket wakeups",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".agents"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "line-too-long",
    "print",
    "shebang-missing-executable-file",
    "missing-return-type-special-method",
    "asyncio-dangling-task",
    "unused-async",
    "suspicious-subprocess-import",
    "subprocess-popen-with-shell-equals-true",
    # "TC001",  # False positives with pydantic
    # "TC002",  # False positives with pydantic
    # "TC003",  # False positives with pydantic
    "missing-todo-link",
    "line-contains-todo",
    "blank-line-with-whitespace",
    "too-many-blank-lines",
    "logging-f-string",
    "ERA",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "implicit-return",
    "raw-string-in-exception",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "complex-structure",
    "too-many-locals",
    "too-many-statements",
    "too-many-public-methods",

    # Umbra preset
    "any-type",
    "async-function-with-timeout",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",        # not needed here
    "DOC",
    "implicit-namespace-package",   # due to how I load modules this results in annoyances
    "pandas-use-of-dot-values",    # this is not a numpy codebase
    "try-except-in-loop",
    "useless-import-alias",  # pyright ruling for `as` imports needed
    "too-many-branches",
    "too-many-arguments",
    "magic-value-comparison",  # I hate this rule
    "no-self-use",
    "bad-quotes-inline-string",
    "ambiguous-unicode-character-string",
    "function-call-in-dataclass-default-argument",
    "suppressible-exception",
    "raise-vanilla-args",   # over-eager rule
    "raise-within-try",   # unrealistic rule
    "extraneous-parentheses",
]
unfixable = [
    "line-too-long", # line length handled in other ways by ruff format
    "ERA",  # Don't delete commented out code
]

[tool.ruff.lint.per-file-ignores]
# Translation tables intentionally contain non-ASCII punctuation and long literal values;
# changing those literals for style would alter localization data or reduce its fidelity.
"src/fleasion/translations/*.py" = ["ambiguous-unicode-character-string", "line-too-long", "hardcoded-string-charset"]
"src/fleasion/cache/rbxm_parser.py" = ["reimplemented-container-builtin"]
# XML parsing uses defusedxml; stdlib ElementTree remains only for types/construction/serialization.
"src/fleasion/cache/animation_viewer.py" = ["suspicious-xml-etree-import"]
"src/fleasion/cache/cache_viewer.py" = ["suspicious-xml-etree-import"]
"src/fleasion/cache/rbxm_preview.py" = ["reimplemented-container-builtin", "suspicious-xml-etree-import"]
"src/fleasion/cache/roblox_document.py" = ["suspicious-xml-etree-import"]
"src/fleasion/cache/tools/animpreview/animpreview.py" = ["suspicious-xml-etree-import"]
# Binary-layout documentation intentionally uses mathematical multiplication/range glyphs.
"src/fleasion/cache/tools/solidmodel_converter/csg_mesh.py" = ["ambiguous-unicode-character-docstring"]
"src/fleasion/cache/tools/solidmodel_converter/obj_to_csg.py" = ["ambiguous-unicode-character-docstring"]
# Direct tool modules intentionally live in the existing namespace-style tools package.
"src/fleasion/cache/tools/orm_compositor.py" = ["implicit-namespace-package"]
"src/fleasion/cache/tools/rgba_ktx2.py" = ["implicit-namespace-package"]
"src/fleasion/cache/tools/solidmodel_converter/rbxm/xml_writer.py" = ["suspicious-xml-etree-import"]
"src/fleasion/gui/rando_stuff_tab.py" = ["suspicious-xml-etree-import"]
"src/fleasion/proxy/addons/texture_stripper.py" = ["suspicious-xml-etree-import", "ambiguous-unicode-character-docstring"]
"src/fleasion/utils/anim_converter.py" = ["suspicious-xml-etree-import"]
"src/fleasion/utils/r15_to_r6.py" = ["suspicious-xml-etree-import", "ambiguous-unicode-character-docstring"]
# These parse only trusted local application/platform XML and preserve existing serialization behavior.
"src/fleasion/modifications/global_settings_manager.py" = ["suspicious-xml-element-tree-usage", "suspicious-xml-etree-import"]
"src/fleasion/utils/platform_windows.py" = ["suspicious-xml-element-tree-usage", "suspicious-xml-etree-import"]
# These files embed QSS/XML/PowerShell protocol templates whose exact runtime text is significant.
"src/fleasion/cache/asset_type_filter.py" = ["line-too-long"]
"src/fleasion/linux_proxy_helper_daemon.py" = ["line-too-long"]
"src/fleasion/proxy/master.py" = ["line-too-long"]
"src/fleasion/utils/autostart.py" = ["line-too-long"]
# Tests intentionally exercise private/dynamic APIs, positional compatibility, runtime
# annotations, callback signatures, and literal expectations from the audited baseline.
"tests/**/*.py" = [
    "assert",
    "implicit-namespace-package",
    "magic-value-comparison",
    "get-attr-with-constant",
    "set-attr-with-constant",
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "boolean-positional-value-in-call",
    "no-self-use",
    "private-member-access",
    "unused-function-argument",
    "unused-method-argument",
    "unused-lambda-argument",
    "missing-return-type-private-function",
    "hardcoded-temp-file",
    "suspicious-subprocess-import",
]
# File-specific test exceptions preserve unittest idioms, Qt/external API fakes,
# import-isolation fixtures, scenario-heavy control flow, and reviewed subprocess/XML fixtures.
"tests/test_account_cookie_storage.py" = ["compare-to-empty-string", "too-many-arguments", "too-many-positional-arguments"]
"tests/test_animation_conversion.py" = ["suspicious-xml-element-tree-usage", "suspicious-xml-etree-import"]
"tests/test_app_single_instance.py" = ["complex-structure", "invalid-function-name", "import-outside-top-level", "too-many-arguments", "unnecessary-lambda"]
"tests/test_audio_player.py" = ["global-statement"]
"tests/test_autostart.py" = ["unnecessary-lambda"]
"tests/test_cache_manager_export.py" = ["mutable-class-default"]
"tests/test_cache_viewer_metadata.py" = ["import-outside-top-level"]
"tests/test_category_filter_popup.py" = ["subprocess-without-shell-equals-true"]
"tests/test_config_manager.py" = ["too-many-public-methods", "pytest-unittest-assertion", "pytest-unittest-raises-assertion"]
"tests/test_csg_mesh.py" = ["too-many-arguments", "too-many-positional-arguments"]
"tests/test_custom_fflags.py" = ["async-busy-wait", "function-uses-loop-variable", "complex-structure", "too-many-arguments", "too-many-statements", "unused-async"]
"tests/test_delete_cache_window.py" = ["unnecessary-dunder-call"]
"tests/test_desktop_integration.py" = ["import-outside-top-level"]
"tests/test_dropdown_combo_box.py" = ["global-statement"]
"tests/test_first_time_setup_dialog.py" = ["invalid-function-name"]
"tests/test_linux_proxy_helper_daemon.py" = ["pytest-assert-in-except", "subprocess-without-shell-equals-true"]
"tests/test_localization.py" = ["complex-structure", "invalid-function-name", "manual-list-comprehension", "import-outside-top-level", "too-many-return-statements", "too-many-branches", "too-many-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "ambiguous-unicode-character-string"]
"tests/test_mesh_rig.py" = ["float-equality-comparison"]
"tests/test_miscellaneous_layout.py" = ["global-statement"]
"tests/test_modifications_localization_layout.py" = ["manual-list-comprehension", "global-statement"]
"tests/test_macos_proxy_helper.py" = ["compare-to-empty-string", "pytest-raises-too-broad"]
"tests/test_modifications_manager.py" = ["complex-structure", "pytest-raises-too-broad", "non-self-return-type"]
"tests/test_platform_linux.py" = ["hardcoded-password-string"]
"tests/test_platform_macos.py" = ["line-too-long"]
"tests/test_platform_windows.py" = ["too-many-public-methods", "too-many-arguments", "non-self-return-type"]
"tests/test_proxy_macos_startup.py" = ["complex-structure", "import-outside-top-level", "too-many-locals", "too-many-statements", "unused-async"]
"tests/test_proxy_server.py" = ["async-function-with-timeout", "import-outside-top-level", "unnecessary-lambda", "pytest-unittest-assertion", "unused-async", "float-equality-comparison"]
"tests/test_proxy_tab_layout.py" = ["global-statement"]
"tests/test_proxy_windows_event_loop.py" = ["too-many-public-methods", "unused-async"]
"tests/test_qt_startup_diagnostics.py" = ["import-outside-top-level", "subprocess-without-shell-equals-true"]
"tests/test_replacer_config_localization_layout.py" = ["manual-list-comprehension", "global-statement"]
"tests/test_replacer_config_menu.py" = ["invalid-function-name", "global-statement"]
"tests/test_roblox_document.py" = ["pytest-unittest-assertion", "pytest-unittest-raises-assertion"]
"tests/test_texture_stripper.py" = ["import-outside-top-level"]
"tests/test_theme_manager.py" = ["invalid-function-name", "non-self-return-type"]
"tests/test_tray_dashboard.py" = ["invalid-function-name", "import-outside-top-level"]
"tests/test_upstream.py" = ["async-function-with-timeout", "blind-except", "too-many-statements-in-try-clause", "pytest-unittest-assertion", "pytest-unittest-raises-assertion", "non-self-return-type"]
"tests/test_username_spoofer.py" = ["class-as-data-structure", "pytest-unittest-assertion"]
"tests/test_windows_ktx_dll_loading.py" = ["import-outside-top-level"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
