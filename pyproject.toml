[build-system]
requires = ['uv_build>=0.11.0,<0.12.0']
build-backend = 'uv_build'

[project]
name = 'fleasion'
version = "2.4.1b1"
description = 'Roblox asset interceptor and replacer with PySide6 GUI'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'browser-cookie3>=0.20.1; sys_platform == "darwin" or sys_platform == "linux"',
    'cryptography>=42.0.0,<49; sys_platform == "darwin"',
    'cryptography>=49; sys_platform != "darwin"',
    'win11toast>=0.36.3; sys_platform == "win32"',
    'pywin32>=307; sys_platform == "win32"',
    'python-dateutil>=2.9.0',
    'platformdirs>=4.0.0',
    'sounddevice>=0.5.3',
    'soundfile>=0.13.1',
    'zstandard>=0.21.0',
    'certifi>=2024.7.4',
    'requests>=2.32.0',
    'defusedxml>=0.7.1',
    'colorama>=0.4.6',
    'pyopengl>=3.1.0',
    'pillow>=11.0.0',
    'DracoPy>=1.3.0',
    'orjson>=3.9.0',
    'numpy==2.3.5; sys_platform == "win32"',
    'numpy>=2.0.0; sys_platform != "win32"',
    'lz4>=4.4.5',
    'packaging>=26.2',
    'pyside6==6.7.3; sys_platform == "darwin"',
    'pyside6>=6.8.0; sys_platform != "darwin"',
]

[project.urls]
Repository = 'https://github.com/fleasion/Fleasion'
Issues = 'https://github.com/fleasion/Fleasion/issues'
Releases = 'https://github.com/fleasion/Fleasion/releases'

[project.scripts]
fleasion = 'fleasion:main'
app = 'fleasion:main'
build = 'fleasion.scripts.build:main'

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "ruff>=0.16.5",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "launcher.py", "conftest.py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "build", "dist", ".agents"]

[tool.pytest.ini_options]
markers = [
    "threaded_asyncio: requires working cross-thread event-loop socket wakeups",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".agents", "tests"]
force-exclude = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # Handled by Ruff format
    "line-too-long",
    "blank-line-with-whitespace",
    "too-many-blank-lines",
    "missing-trailing-comma",
    "bad-quotes-inline-string",
    "extraneous-parentheses",

    # Documentation and type annotations
    "D",  # Not needed here
    "DOC",
    "any-type",
    "missing-return-type-special-method",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",

    # Imports and package structure
    "implicit-namespace-package",  # Package lookup can make this annoying
    "useless-import-alias",  # Pyright requires some `as` imports
    # "typing-only-first-party-import",  # False positives with Pydantic
    # "typing-only-third-party-import",  # False positives with Pydantic
    # "typing-only-standard-library-import",  # False positives with Pydantic

    # Function and class design
    "no-self-use",  # Can easily break code
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "too-many-public-methods",

    # Complexity and control flow
    "complex-structure",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "magic-value-comparison",  # I hate this rule
    "implicit-return-value",

    # Exceptions
    "suppressible-exception",
    "raise-vanilla-args",  # Over-eager rule
    "raise-within-try",  # Unrealistic rule
    # "raw-string-in-exception",  # Fine for libs like discord.py

    # Async code
    "unused-async",  # Can easily break code
    "async-function-with-timeout",

    # Logging and console output
    "print",
    "logging-f-string",  # I hate this rule

    # Subprocess security
    "suspicious-subprocess-import",
    "subprocess-popen-with-shell-equals-true",
    "subprocess-without-shell-equals-true",

    # Source and repository hygiene
    "ERA",  # Keep commented-out code
    "missing-todo-link",
    "line-contains-todo",
    "missing-copyright-notice",
    "shebang-missing-executable-file",
    "ambiguous-unicode-character-string",
    "unsorted-dunder-all",  # Public export order is a tested compatibility contract
    "unsorted-dunder-slots",  # Slot order is a tested compatibility contract

    # Data models and library-specific rules
    "function-call-in-dataclass-default-argument",
    "pandas-use-of-dot-values",  # Not a pandas codebase
]
unfixable = [
    "ERA",  # Don't delete commented-out code
    "line-too-long",  # Ruff format handles line length
]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    # Qt compatibility hooks and generated UI APIs.
    "defaultFramebufferObject",
    "doneCurrent",
    "fileDropped",
    "initializeGL",
    "isExposed",
    "makeCurrent",
    "paintGL",
    "resizeGL",
    "retranslateUi",
    "setFormat",
    "setupUi",

    # Third-party API spellings mirrored by local typing stubs.
    "gl*",
    "vtk*",
    "AddLight",
    "Azimuth",
    "Close",
    "CreateKey",
    "CreateKeyEx",
    "DeleteValue",
    "EnumKey",
    "GetElement",
    "Identity",
    "Invert",
    "Multiply4x4",
    "OpenKey",
    "QueryValueEx",
    "RemoveAllLights",
    "SetClippingRange",
    "SetElement",
    "SetFocalPoint",
    "SetIntensity",
    "SetLightTypeToHeadlight",
    "SetLightTypeToSceneLight",
    "SetPosition",
    "SetUserMatrix",
    "SetValueEx",
]
