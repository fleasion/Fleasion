[build-system]
requires = ['uv_build>=0.11.0,<0.12.0']
build-backend = 'uv_build'

[project]
name = 'fleasion'
version = "2.4.1b1"
description = 'Roblox asset interceptor and replacer with PyQt6 GUI'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'browser-cookie3>=0.20.1; sys_platform == "darwin" or sys_platform == "linux"',
    'cryptography>=42.0.0,<49; sys_platform == "darwin"',
    'cryptography>=49; sys_platform != "darwin"',
    'win11toast>=0.36.3; sys_platform == "win32"',
    'pywin32>=307; sys_platform == "win32"',
    'pyqt6==6.7.1; sys_platform == "darwin"',
    'pyqt6-qt6==6.7.3; sys_platform == "darwin"',
    'pyqt6>=6.8.0; sys_platform != "darwin"',
    'python-dateutil>=2.9.0',
    'platformdirs>=4.0.0',
    'sounddevice>=0.5.3',
    'soundfile>=0.13.1',
    'zstandard>=0.21.0',
    'certifi>=2024.7.4',
    'requests>=2.32.0',
    'colorama>=0.4.6',
    'pyopengl>=3.1.0',
    'pillow>=11.0.0',
    'DracoPy>=1.3.0',
    'orjson>=3.9.0',
    'numpy==2.3.5; sys_platform == "win32"',
    'numpy>=2.0.0; sys_platform != "win32"',
    'lz4>=4.4.5',
    'packaging>=26.2',
]

[project.urls]
Repository = 'https://github.com/fleasion/Fleasion'
Issues = 'https://github.com/fleasion/Fleasion/issues'
Releases = 'https://github.com/fleasion/Fleasion/releases'

[project.scripts]
fleasion = 'fleasion:main'
app = 'fleasion:main'
build = 'fleasion.scripts.build:main'

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "ruff>=0.16.5",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "launcher.py", "conftest.py"]
exclude = ["build", "dist", ".agents"]

[tool.pytest.ini_options]
markers = [
    "threaded_asyncio: requires working cross-thread event-loop socket wakeups",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".agents"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with ruff format
    "CPY001",  # No repository-wide copyright-header policy
    "D",       # Docstrings are opt-in per AGENTS.md
    "DOC",     # Docstrings are opt-in per AGENTS.md
    "ISC001",  # Conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # pytest uses plain assert

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
